<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Μαθαίνω!"><link rel="manifest" href="manifest.webmanifest"><title>Μαθαίνω!</title><style>body{margin:0;background:#f0f5ff;color:#193052;font-family:system-ui,sans-serif}main{max-width:700px;margin:auto;padding:20px}section{background:white;padding:22px;border-radius:20px;margin:18px 0;box-shadow:0 5px 20px #0001}h1{margin-bottom:4px}p{color:#64748b}button,select{font:inherit;padding:12px 15px;border:1px solid #cad8ef;background:white;color:#193052;border-radius:12px;cursor:pointer}button:focus-visible{outline:3px solid orange}.primary{background:#2563eb;color:white}.active{background:#dbeafe;border-color:#2563eb}.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.card{display:flex;justify-content:space-between;align-items:center;background:#f3f7ff;padding:12px;margin:8px 0;border-radius:12px;gap:12px}.card button{min-width:125px}.choice{display:block;width:100%;text-align:left;margin:8px 0}.hidden{display:none}select{width:100%;margin:10px 0 18px}.good{background:#dcfce7}.bad{background:#fee2e2}</style></head><body><main><h1>📚 Μαθαίνω!</h1><p>Μαθαίνω με τον δικό μου ρυθμό.</p><section id="home"><h2>Διάλεξε μάθημα</h2><div class="row" id="subjects"><button data-sub="math" class="active">✖️ Προπαίδεια</button><button data-sub="fr">🇫🇷 Γαλλικά</button><button data-sub="en">🇬🇧 Αγγλικά</button></div><label>Ενότητα</label><select id="topic"></select><label>Πόσες ερωτήσεις;</label><select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select><div class="row"><button class="primary" id="study">📖 Μελέτη</button><button id="practice">✏️ Εξάσκηση</button></div></section><section id="learn" class="hidden"><button class="back">← Πίσω</button><h2 id="learnTitle"></h2><p>Πάτησε σε κάθε απάντηση για να τη δεις.</p><div class="row"><button id="hide" class="active">Κρύψε όλες</button><button id="show">Δείξε όλες</button></div><div id="cards"></div><button class="primary" id="practiceFromStudy">Εξάσκηση →</button></section><section id="test" class="hidden"><button class="back">← Πίσω</button><p id="progress"></p><h2 id="question"></h2><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" class="primary hidden">Επόμενο →</button></section><section id="end" class="hidden"><h2>Μπράβο για την προσπάθεια! 🌟</h2><p id="summary"></p><button class="back primary">Νέο μάθημα</button></section><p style="text-align:center">Μαθαίνω! v0.3 · Χωρίς χρονόμετρα και πίεση</p></main><script>
const vocab={fr:{'Ζώα':[['chat','γάτα'],['chien','σκύλος'],['oiseau','πουλί'],['poisson','ψάρι'],['cheval','άλογο'],['lapin','κουνέλι']],'Χρώματα':[['rouge','κόκκινο'],['bleu','μπλε'],['vert','πράσινο'],['jaune','κίτρινο'],['noir','μαύρο'],['blanc','λευκό']],'Ημέρες':[['lundi','Δευτέρα'],['mardi','Τρίτη'],['mercredi','Τετάρτη'],['jeudi','Πέμπτη'],['vendredi','Παρασκευή'],['samedi','Σάββατο'],['dimanche','Κυριακή']],'Εποχές':[['printemps','άνοιξη'],['été','καλοκαίρι'],['automne','φθινόπωρο'],['hiver','χειμώνας']]},en:{'Ζώα':[['cat','γάτα'],['dog','σκύλος'],['bird','πουλί'],['fish','ψάρι'],['horse','άλογο'],['rabbit','κουνέλι']],'Χρώματα':[['red','κόκκινο'],['blue','μπλε'],['green','πράσινο'],['yellow','κίτρινο'],['black','μαύρο'],['white','λευκό']],'Ημέρες':[['Monday','Δευτέρα'],['Tuesday','Τρίτη'],['Wednesday','Τετάρτη'],['Thursday','Πέμπτη'],['Friday','Παρασκευή'],['Saturday','Σάββατο'],['Sunday','Κυριακή']],'Εποχές':[['spring','άνοιξη'],['summer','καλοκαίρι'],['autumn','φθινόπωρο'],['winter','χειμώνας']]}};
const $=x=>document.getElementById(x);let sub='math',data=[],qs=[],i=0,first=0,miss=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function screen(id){['home','learn','test','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}function topics(){let names=sub==='math'?['Όλες οι προπαίδειες',...Array.from({length:10},(_,i)=>'Προπαίδεια του '+(i+1))]:['Όλες οι κατηγορίες',...Object.keys(vocab[sub])];$('topic').replaceChildren(...names.map((name,i)=>{let o=document.createElement('option');o.value=i;o.textContent=name;return o}))}function entries(){let n=+$('topic').value;if(sub==='math'){let nums=n?[n]:Array.from({length:10},(_,i)=>i+1);return nums.flatMap(t=>Array.from({length:10},(_,i)=>({q:t+' × '+(i+1),a:String(t*(i+1))})))}let names=Object.keys(vocab[sub]);return(n?[names[n-1]]:names).flatMap(x=>vocab[sub][x].map(([q,a])=>({q,a})))}function study(){data=entries();$('learnTitle').textContent=$('topic').selectedOptions[0].textContent;$('cards').replaceChildren(...data.map(x=>{let d=document.createElement('div');d.className='card';let s=document.createElement('strong');s.textContent=x.q;let b=document.createElement('button');b.textContent='Δες απάντηση';b.dataset.answer=x.a;b.dataset.visible='0';b.onclick=()=>{b.dataset.visible=b.dataset.visible==='0'?'1':'0';b.textContent=b.dataset.visible==='1'?x.a:'Δες απάντηση'};d.append(s,b);return d}));screen('learn')}function toggleAnswers(visible){document.querySelectorAll('#cards button').forEach(b=>{b.dataset.visible=visible?'1':'0';b.textContent=visible?b.dataset.answer:'Δες απάντηση'})}function start(){data=entries();let order=shuffle(data);qs=Array.from({length:+$('count').value},(_,j)=>order[j%order.length]);i=0;first=0;render();screen('test')}function render(){miss=false;$('progress').textContent='Ερώτηση '+(i+1)+' από '+qs.length;$('question').textContent=qs[i].q+' = ?';$('feedback').textContent='';$('next').classList.add('hidden');let right=qs[i].a;let pool=sub==='math'?Array.from({length:100},(_,i)=>String(i+1)):data.map(x=>x.a);let opts=shuffle([right,...shuffle([...new Set(pool.filter(x=>x!==right))]).slice(0,3)]);$('answers').replaceChildren(...opts.map(answer=>{let b=document.createElement('button');b.className='choice';b.textContent=answer;b.onclick=()=>{if(answer===right){b.classList.add('good');if(!miss)first++;$('feedback').textContent='Σωστά!';$('answers').querySelectorAll('button').forEach(x=>x.disabled=true);$('next').classList.remove('hidden')}else{miss=true;b.classList.add('bad');b.disabled=true;$('feedback').textContent='Δοκίμασε ξανά!'}};return b}))}document.querySelectorAll('#subjects button').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;document.querySelectorAll('#subjects button').forEach(x=>x.classList.toggle('active',x===b));topics()});document.querySelectorAll('.back').forEach(b=>b.onclick=()=>screen('home'));$('study').onclick=study;$('practice').onclick=start;$('practiceFromStudy').onclick=start;$('hide').onclick=()=>toggleAnswers(false);$('show').onclick=()=>toggleAnswers(true);$('next').onclick=()=>{i++;if(i===qs.length){$('summary').textContent='Σωστά με την πρώτη: '+first+' από '+qs.length+'. Μπορείς να ξαναδοκιμάσεις όποτε θέλεις.';screen('end')}else render()};topics();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
