<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Μαθαίνω! · Επαναφορά κωδικού</title><style>body{font-family:system-ui,sans-serif;background:#f0f5ff;color:#193052;margin:0;padding:24px}main{max-width:440px;margin:10vh auto;background:white;border-radius:20px;padding:26px;box-shadow:0 5px 20px #0001}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid #cad8ef}button{background:#2563eb;color:white;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}#status{color:#36577d}</style></head><body><main><h1>Μαθαίνω!</h1><h2>Νέος κωδικός πρόσβασης</h2><p>Όρισε νέο κωδικό για τον λογαριασμό σου.</p><form id="form"><label for="pass">Νέος κωδικός</label><input id="pass" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Επιβεβαίωση κωδικού</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="save" disabled>Αποθήκευση νέου κωδικού</button></form><p id="status" role="status">Αναμονή επιβεβαίωσης συνδέσμου…</p><p><a href="./">Επιστροφή στην εφαρμογή</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>(async()=>{const status=document.getElementById('status'),save=document.getElementById('save'),form=document.getElementById('form');if(!window.supabase){status.textContent='Αδυναμία φόρτωσης. Έλεγξε τη σύνδεση στο Internet.';return}const db=window.supabase.createClient('https://yijpejuacjmucarqntlf.supabase.co','sb_publishable_ONNT2HmZBkTVQVREZ-1IXA_V82D5-AI',{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});let verified=false;const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));const recoveryHint=params.get('type')==='recovery'||hash.get('type')==='recovery'||params.has('password_reset');function ready(){verified=true;save.disabled=false;status.textContent='Ο σύνδεσμος επαληθεύτηκε. Μπορείς να ορίσεις νέο κωδικό.'}db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)ready()});const {data,error}=await db.auth.getSession();if(error){status.textContent='Σφάλμα επιβεβαίωσης: '+error.message;return}if(data?.session&&recoveryHint)ready();else status.textContent='Για αλλαγή κωδικού άνοιξε τον σύνδεσμο από το email επαναφοράς. Αυτή η σελίδα μπορεί να δοκιμαστεί χωρίς email, αλλά δεν επιτρέπει αποθήκευση χωρίς έγκυρο σύνδεσμο.';form.onsubmit=async e=>{e.preventDefault();if(!verified)return;const pass=document.getElementById('pass').value;if(pass!==document.getElementById('confirm').value){status.textContent='Οι κωδικοί δεν ταιριάζουν.';return}save.disabled=true;const {error}=await db.auth.updateUser({password:pass});if(error){status.textContent='Αποτυχία: '+error.message;save.disabled=false;return}status.textContent='Ο κωδικός άλλαξε επιτυχώς. Μπορείς να επιστρέψεις στη σύνδεση.';await db.auth.signOut()}})();</script></body></html>
