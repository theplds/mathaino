name: Import licensed car photo binaries (temporary branch workflow)
on:
  push:
    branches:
      - feature/car-gallery-cohesive-licensed-set-v0-6-81
    paths:
      - .github/workflows/import-licensed-cars.yml
permissions:
  contents: write
jobs:
  download:
    if: github.repository == 'theplds/mathaino'
    strategy:
      fail-fast: false
      matrix:
        brand: [Ferrari, Lamborghini, Porsche, BMW, Nissan, Ford, Chevrolet, Tesla]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Retrieve one CC-licensed photo on this runner
        run: node scripts/import-car-photo-binaries.cjs "${{ matrix.brand }}"
      - uses: actions/upload-artifact@v4
        with:
          name: car-${{ matrix.brand }}
          path: car-staging/
          if-no-files-found: error
  commit:
    if: github.repository == 'theplds/mathaino'
    needs: download
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/car-gallery-cohesive-licensed-set-v0-6-81
      - uses: actions/download-artifact@v4
        with:
          pattern: car-*
          merge-multiple: true
          path: assets/cars
      - name: Validate JPG signatures and publish assets to the review branch
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=fs.readdirSync('assets/cars').filter(x=>x.endsWith('.jpg'));
          if(files.length!==8)throw Error('Expected 8 car JPEGs, got '+files.length);
          for(const name of files){
            const b=fs.readFileSync('assets/cars/'+name);
            if(b.length<15000||b[0]!==255||b[1]!==216||b[2]!==255)throw Error('Invalid JPEG '+name);
          }
          console.log('Validated '+files.length+' real-car JPEGs');
          NODE
          git config user.name "mathaino-image-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cars
          git commit -m "Bundle eight licensed real-car JPEGs for offline recognition"
          git push origin HEAD:feature/car-gallery-cohesive-licensed-set-v0-6-81
