name: Security regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify static and policy protections
        run: node scripts/security-audit.cjs
      - name: Check pinned Supabase CDN against official npm release and report SRI
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="@supabase/supabase-js@2.49.10"
          CDN="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"
          mkdir -p /tmp/mathaino-sdk && cd /tmp/mathaino-sdk
          npm pack --silent "$PACKAGE" > tarball_name.txt
          tar -xzf "$(cat tarball_name.txt)"
          echo 'Package files matching supabase / UMD:'
          find package -type f | grep -E 'umd|supabase(\.min)?\.js' | head -25 || true
          curl --fail --location --silent --show-error --max-time 30 "$CDN" -o cdn.js
          echo "CDN bytes: $(wc -c < cdn.js)"
          if test -f package/dist/umd/supabase.min.js; then cmp package/dist/umd/supabase.min.js cdn.js; else echo 'No prebuilt UMD minified file in npm archive'; exit 1; fi
          printf 'Verified SRI: sha384-'
          openssl dgst -sha384 -binary cdn.js | openssl base64 -A
          printf '\n'
