name: Security regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify static and policy protections
        run: node scripts/security-audit.cjs
      - name: Verify grade-specific intro banks and non-repeating pictures
        run: node scripts/intro-regression.cjs
      - name: Check pinned Supabase CDN against official npm release and report SRI
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="@supabase/supabase-js@2.49.10"
          CDN="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"
          mkdir -p /tmp/mathaino-sdk && cd /tmp/mathaino-sdk
          npm pack --silent "$PACKAGE" > tarball_name.txt
          tar -xzf "$(cat tarball_name.txt)"
          # npm ships original UMD; jsDelivr generates its minified variant.
          test -f package/dist/umd/supabase.js
          curl --fail --location --silent --show-error --max-time 30 "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.js" -o cdn-original.js
          cmp package/dist/umd/supabase.js cdn-original.js
          curl --fail --location --silent --show-error --max-time 30 "$CDN" -o cdn.js
          test "$(wc -c < cdn.js)" -gt 80000
          HASH="sha384-$(openssl dgst -sha384 -binary cdn.js | openssl base64 -A)"
          echo "Verified SRI: $HASH"
          test "$HASH" = "sha384-ARQ6JMpleHd1EQUxL9V4CSjKPqSyRfswRYBiVKcn1MT6zUD+BdOm/NYzic64PuF4"
